# The four mcp-client rows appended to the standard preset list.
# __NPX__ is replaced by the installer with the absolute npx path.
          - id: mcp-zai-zread
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: streamable-http
              serverName: zai-zread
              url: https://api.z.ai/api/mcp/zread/mcp
              headers:
                Authorization: !!js '`Bearer ${process.env.ZAI_API_KEY}`'
          - id: mcp-zai-reader
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: streamable-http
              serverName: zai-reader
              url: https://api.z.ai/api/mcp/web_reader/mcp
              headers:
                Authorization: !!js '`Bearer ${process.env.ZAI_API_KEY}`'
          - id: mcp-zai-search
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: streamable-http
              serverName: zai-search
              url: https://api.z.ai/api/mcp/web_search_prime/mcp
              headers:
                Authorization: !!js '`Bearer ${process.env.ZAI_API_KEY}`'
          - id: mcp-zai-vision
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: stdio
              serverName: zai-vision
              command: __NPX__
              args: ['-y', '@z_ai/mcp-server@latest']
              env:
                Z_AI_API_KEY: !!js process.env.ZAI_API_KEY
                Z_AI_MODE: ZAI
